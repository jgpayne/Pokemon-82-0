server {
  # Unprivileged nginx image: runs as the nginx user, so it can't bind port 80.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Only static files are served; refuse everything but reads.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets and sprites never change.
  location ~* ^/(assets|sprites)/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never serve dotfiles (e.g. a stray .env or .git) or the Cloudflare Pages
  # header config that the build copies alongside the site.
  location ~ /\. {
    return 404;
  }
  location = /_headers {
    return 404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
