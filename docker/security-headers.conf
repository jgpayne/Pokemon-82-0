# Included in every location block: nginx drops server-level add_header
# directives in any location that sets its own, so headers live here instead.
# Keep in sync with public/_headers (used by Cloudflare Pages).

# Everything is self-hosted. style-src needs 'unsafe-inline' for the animation
# library's inline style attributes; worker-src blob: is for canvas-confetti.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only takes effect when served over HTTPS (e.g. through the Cloudflare tunnel).
add_header Strict-Transport-Security "max-age=31536000" always;
