services:
  web:
    build: .
    image: poke-82-0:latest
    ports:
      # Localhost only: the tunnel reaches web over Docker's internal network,
      # so the plain-HTTP port doesn't need to be open to the LAN/internet.
      # Set BIND_ADDRESS=0.0.0.0 in .env to open it to your network.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  tunnel:
    build:
      context: docker
      dockerfile: tunnel.Dockerfile
    image: poke-82-0-tunnel:latest
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_TARGET: http://web:8080
      TUNNEL_PROTOCOL: ${TUNNEL_PROTOCOL:-http2}
    healthcheck:
      # Healthy only while at least one connection to Cloudflare is registered.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2000/ready"]
      interval: 15s
      timeout: 3s
      # cloudflared may need a few minutes of retries on firewalled networks.
      start_period: 3m
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
