services:
  web:
    build: .
    image: poke-82-0:latest
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

  tunnel:
    build:
      context: docker
      dockerfile: tunnel.Dockerfile
    image: poke-82-0-tunnel:latest
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_TARGET: http://web:80
      TUNNEL_PROTOCOL: ${TUNNEL_PROTOCOL:-http2}
    healthcheck:
      # Healthy only while at least one connection to Cloudflare is registered.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2000/ready"]
      interval: 15s
      timeout: 3s
      # cloudflared may need a few minutes of retries on firewalled networks.
      start_period: 3m
      retries: 3
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
